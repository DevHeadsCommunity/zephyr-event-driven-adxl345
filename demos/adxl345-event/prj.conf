# Shared settings, the same on every board. Board-specific bits go in boards/<board>.conf.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SENSOR=y
# With async SPI, each burst finishes in the SPI/DMA interrupt and no thread has to wait.
# If your SPI driver doesn't support async, set this to n and the driver will use
# blocking reads on its own work queue instead.
CONFIG_SPI_ASYNC=y

CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_INF=y

# Needed for the CPU load shown on the status line
CONFIG_THREAD_RUNTIME_STATS=y

# Wait 5 s after reset before talking to the sensor. The boot banner and all other
# output come after that, so a terminal that connects a bit late doesn't miss anything.
CONFIG_ADXL345_BURST_STARTUP_DELAY_MS=5000
