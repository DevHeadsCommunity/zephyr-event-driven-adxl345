description: |
  ADXL345 accelerometer read with SPI burst reads (0xF2), with the FIFO and
  the watermark interrupt done in software.

  Made for the ECW emulated ADXL345 sensor (HIL), which only needs DEVID (0x80)
  and the data burst (0xF2) and doesn't use the INT1 pin. The driver samples
  at sampling-frequency, queues every sample, and fires
  SENSOR_TRIG_FIFO_WATERMARK once fifo-watermark samples are waiting. A real
  ADXL345 behaves the same way with its FIFO and INT1, so the app keeps
  working if you switch to the real part (compatible "adi,adxl345").

compatible: "ecw,adxl345-burst"

include: [sensor-device.yaml, spi-device.yaml]

properties:
  sampling-frequency:
    type: int
    default: 100
    description: Burst-read rate in Hz (can be changed with SENSOR_ATTR_SAMPLING_FREQUENCY).

  fifo-watermark:
    type: int
    default: 10
    description: Number of samples that raises SENSOR_TRIG_FIFO_WATERMARK (1..32).
